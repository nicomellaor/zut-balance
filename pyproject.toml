[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zut-balance"
version = "0.1.0"
description = "Bank statement ingestion for Zut Balance"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pypdf>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
